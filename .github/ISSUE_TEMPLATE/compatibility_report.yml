name: 设备兼容性报告
description: 报告某款 Android 设备的闹钟触发结果
title: "[兼容性] "
labels:
  - compatibility
body:
  - type: input
    id: device
    attributes:
      label: 手机品牌与完整型号
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Android 与厂商系统版本
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: 触发前状态
      options:
        - 前台
        - 后台
        - 已从最近任务划掉
        - 熄屏锁屏
        - 重启后未打开 App
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: 已允许的相关权限
      description: 精确闹钟、通知、摄像头、自启动、后台弹出、锁屏显示和后台耗电等。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 结果与复现步骤
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有公开上传视频、个人信息、设备标识或未脱敏日志。
          required: true
