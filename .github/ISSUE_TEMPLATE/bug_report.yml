name: Bug 报告
description: 报告可以稳定复现的 App 功能问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿上传刷牙视频、浴室画面、未脱敏日志或个人信息。
  - type: input
    id: app_version
    attributes:
      label: App 版本
      placeholder: 例如 1.0.0 release
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: 品牌、完整型号、Android 与厂商系统版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按时间顺序列出操作
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有附加刷牙视频、浴室画面、个人信息或未脱敏日志。
          required: true
