name: 模型识别反馈 / Model feedback
description: 不上传视频的识别反馈 / Recognition feedback without video uploads
title: "[模型] "
labels:
  - model
body:
  - type: markdown
    attributes:
      value: |
        本表单只接受文字与脱敏后的聚合数值。不要上传视频、照片、浴室画面或原始 CSV。
        Submit only text and redacted aggregate values. Do not upload video, photos, bathroom footage, or raw CSV files.
  - type: input
    id: version
    attributes:
      label: App 与模型版本 / App and model version
      placeholder: 例如 / e.g. 1.0.1 / s3d-brush-2s-192-feedback-v1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统 / Device and OS
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: 场景说明 / Conditions
      description: 可描述光线、手机距离、角度、牙刷类型和动作，不要写可识别个人的信息。 / Describe lighting, distance, angle, toothbrush, and motion without identifiable data.
    validations:
      required: true
  - type: dropdown
    id: behavior
    attributes:
      label: 主要问题 / Main issue
      options:
        - 真实刷牙漏检 / Missed real brushing
        - 未刷牙误报 / False positive without brushing
        - 进度响应过慢 / Progress responds too slowly
        - 进度与动作不同步 / Progress is out of sync
        - 其他数值表现 / Other numerical behavior
    validations:
      required: true
  - type: textarea
    id: aggregates
    attributes:
      label: 可选的脱敏聚合数值 / Optional redacted aggregates
      description: 例如总时长、通过时间、置信度分位数；不要粘贴原始逐行日志。 / For example total duration, pass time, or score percentiles; do not paste raw row-level logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认 / Privacy confirmation
      options:
        - label: 我没有附加视频、照片、个人信息或原始日志。 / I attached no video, photos, personal data, or raw logs.
          required: true
